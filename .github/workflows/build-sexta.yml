name: Build Sexta-feira
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o sexta-projeto.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd proj/sexta && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Sexta-feira-APK
          path: proj/sexta/app/build/outputs/apk/debug/app-debug.apk
